<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halal Rishta</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f7f3;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 92%;
      max-width: 430px;
      text-align: center;
      background: white;
      padding: 45px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      font-size: 58px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .tagline {
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #176b45;
      color: white;
    }

    .secondary {
      background: #eef3ef;
      color: #176b45;
    }

    .note {
      margin-top: 25px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">💚</div>

    <h1>Halal Rishta</h1>

    <p class="tagline">
      A trusted place to find a compatible marriage partner
      with privacy, respect and serious intentions.
    </p>

    <button class="btn primary" onclick="alert('Registration coming soon')">
      Create Account
    </button>

    <button class="btn secondary" onclick="alert('Login coming soon')">
      Login
    </button>

    <p class="note">
      Built with privacy and serious marriage intentions in mind.
    </p>
  </div>
</body>
</html>
